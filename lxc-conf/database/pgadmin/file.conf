name: immich

services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: xxxxx@gmail.com
      PGADMIN_DEFAULT_PASSWORD: --------
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
