version: '3.8'

secrets:
  # Secrets are single-line text files where the sole content is the secret
  DB_ROOT_PWD:
    file: ./db_root_pwd.txt
  MYSQL_PWD:
    file: ./mysql_pwd.txt

services:
  appsec-npm:
    container_name: npm-attachment
    image: 'ghcr.io/openappsec/nginx-proxy-manager-attachment:latest'
    ipc: host
    restart: unless-stopped
    ports:
      # These ports are in format <host-port>:<container-port>
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
      # Add any other Stream port you want to expose
      - '8096:8096/udp' # Jellyfin
      - '8096:8096'
      - '8920:8920/udp'
      - '8920:8920'
      - '1900:1900/udp'
      - '7359:7359/udp'
    environment:
      # Mysql/Maria connection parameters:
      DB_MYSQL_HOST: "db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD__FILE: /run/secrets/MYSQL_PWD
      DB_MYSQL_NAME: "npm"
      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: 'true'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./appsec/appsec-logs:/ext/appsec-logs
      - ./appsec/appsec-localconfig:/ext/appsec
    depends_on:
      - db
    secrets:
      - MYSQL_PWD

  appsec-agent:
    container_name: appsec-agent
    image: 'ghcr.io/openappsec/agent:latest'
    network_mode: service:appsec-npm
    ipc: host
    restart: unless-stopped
    environment:
      # adjust with your own email below
      - user_email=youremail@mail.com
      - nginxproxymanager=true
      - autoPolicyLoad=true
    volumes:
      - ./appsec/appsec-config:/etc/cp/conf
      - ./appsec/appsec-data:/etc/cp/data
      - ./appsec/appsec-logs:/var/log/nano_agent
      - ./appsec/appsec-localconfig:/ext/appsec
    command: /cp-nano-agent --standalone

  db:
    image: 'jc21/mariadb-aria:latest'
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD__FILE: /run/secrets/DB_ROOT_PWD
      MYSQL_DATABASE: 'npm'
      MYSQL_USER: 'npm'
      MYSQL_PASSWORD__FILE: /run/secrets/MYSQL_PWD
      MARIADB_AUTO_UPGRADE: '1'
    volumes:
      - ./mysql:/var/lib/mysql
    secrets:
      - DB_ROOT_PWD
      - MYSQL_PWD