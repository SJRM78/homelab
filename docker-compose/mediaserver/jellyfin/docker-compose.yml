services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 0:0 #"${UID}:${GID}"
    #network_mode: 'host'
    environment:
      - JELLYFIN_PublishedServerUrl=http://media.famramosp.org
      - UID=0 #$(id-u)
      - GID=0 #$(id -g)
      - TEMPVAR=vartemporal
    volumes:
      - ./config:/config
      - ./cache:/cache
      - type: bind
        source: /data/media
        target: /media
    #     read_only: true
    restart: 'unless-stopped'
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 8096:8096  # HTTP
      - 8920:8920  # HTTPS
      - 1900:1900/udp  # Autodiscovery
      - 7359:7359/udp  # Autodiscovery
    devices:
      - /dev/dri:/dev/dri
