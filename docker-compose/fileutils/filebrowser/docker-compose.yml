version: '3'
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: always
    volumes:
      - /data:/srv #Change to match your directory
      - ./filebrowser.db:/filebrowser.db #Change to match your directory
      - ./filebrowser.json:/.filebrowser.json #Change to match your directory
    environment:
      - PUID=$(id -u)
      - PGID=$(id -g)
    ports:
      - 8080:80 #Change the port if needed
      